name: Godot Windows Nightly

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.5.1
  PROJECT_PATH: .
  EXPORT_NAME: "Windows Desktop"
  OUTPUT_FILENAME: "Enter in disguise Steal!.exe"

jobs:
  build_windows:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Build Windows Desktop
        run: |
          mkdir -v -p build/windows
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "$EXPORT_NAME" "$EXPORT_DIR/windows/$OUTPUT_FILENAME"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows

  update_release:
    needs: build_windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/windows

      - name: Zip Build
        run: |
          cd build/windows
          zip -r ../../EnterInDisguise-Windows.zip ./*

      - name: Update Nightly Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "EnterInDisguise-Windows.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          # This configures the "Overwriting" behavior:
          tag: "nightly"
          name: "Nightly Build (Windows)"
          body: "This is an automated build from the latest commit on main (${{ github.sha }})."
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
